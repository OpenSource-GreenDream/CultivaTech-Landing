<div class="hero-visual-container">
  <div class="metric-card card-humidity">
    <div class="metric-icon">💧</div>
    <div class="metric-info">
      <span class="label">{{ 'hero-visual.humidity' | translate }}</span>
      <span class="value">32%</span>
    </div>
  </div>

  <div class="metric-card card-nutrients">
    <div class="metric-icon">🌱</div>
    <div class="metric-info">
      <span class="label">{{ 'hero-visual.nutrients' | translate }}</span>
      <span class="value status-good">{{ 'hero-visual.optimus' | translate }}</span>
    </div>
  </div>

  <div class="metric-card card-temp">
    <div class="metric-icon">🌡️</div>
    <div class="metric-info">
      <span class="label">{{ 'hero-visual.temp' | translate }}</span>
      <span class="value">18°C</span>
    </div>
  </div>

  <div class="main-image-placeholder">
    <span>
      <img src="/assets/hero-img.jpeg" alt="Hero Image" />
    </span>
  </div>
</div>
